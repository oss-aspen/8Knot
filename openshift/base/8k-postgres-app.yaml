# Durable application datastore (share links).
#
# IMPORTANT (ops): this is NOT the cache. Unlike eightknot-postgres-cache, this
# instance and its PVC MUST be excluded from the weekly namespace reset and from
# any automated cache-reset (issue #1070). Wiping it breaks every shared URL,
# which is the stability promise of the share feature.
#
# STUB: review storage size, image choice, and resource limits before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"postgresql:13-el8","namespace":"openshift"},"fieldPath":"spec.template.spec.containers[?(@.name==\"postgresql\")].image","pause":"true"}]
  name: eightknot-postgres-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: eightknot-postgres-app
  template:
    metadata:
      labels:
        name: eightknot-postgres-app
    spec:
      containers:
        - image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:13-el8
          name: postgresql
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/pgql/data
              name: postgres-app-data
          envFrom:
            - secretRef:
                name: eightknot-postgres
      restartpolicy: always
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 512Mi
      volumes:
        - name: postgres-app-data
          persistentVolumeClaim:
            claimName: eightknot-postgres-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-app
spec:
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    name: eightknot-postgres-app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eightknot-postgres-app-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Share links are tiny (one short row each); 8Gi is generous headroom.
      storage: 8Gi
  volumeMode: Filesystem
