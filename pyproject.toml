[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "8Knot"
dynamic = ["version"]
description = "Dash app built by Red Hat's Open Source Program Office to analyze community and contribution data for git repositories"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "celery~=5.5",
    "dash~=3.2.0",
    "dash-bootstrap-components~=2.0",
    "dash-bootstrap-templates~=2.0",
    "dash-mantine-components~=2.2",
    "flask~=3.1",
    "flask-login~=0.6",
    "gunicorn~=23.0",
    "numpy~=2.0",
    "pandas~=2.3.0",
    "plotly~=6.3",
    "psycopg2-binary==2.9.9",
    "pyarrow~=21.0",
    "python-dateutil~=2.9",
    "rapidfuzz~=3.13",
    "redis~=6.4",
    "sqlalchemy~=2.0",
]

# The release version lives in 8Knot/metadata.py so the running app can import it
# (pyproject.toml is not shipped into the container). Same pattern as CollectOSS.
[tool.setuptools]
package-dir = { "" = "8Knot" }
packages = []

[tool.setuptools.dynamic]
version = { attr = "metadata.__version__" }
