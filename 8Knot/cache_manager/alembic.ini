# Alembic config for the cache schema. env.py builds the database URL from
# cx_common's CACHE_* env vars; db_init.py runs upgrades on boot.
#
# New numeric revision (with CACHE_*/AUGUR_* env vars set and the cache DB running):
#
#   cd 8Knot/cache_manager
#   alembic revision -m "describe change"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
# Run env.py's numbering hook for handwritten revisions as well as autogenerate.
revision_environment = true
